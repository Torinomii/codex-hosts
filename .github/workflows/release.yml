name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: Build release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.92
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
          rustc --version
          cargo --version

      - name: Resolve release tag from Cargo.toml
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed"
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq "codex-hosts" })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one codex-hosts package in Cargo metadata"
          }
          $tag = "v$($packages[0].version)"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Cargo.toml version must use the MAJOR.MINOR.PATCH format"
          }
          if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME -ne $tag) {
            throw "Pushed tag '$env:REF_NAME' does not match Cargo.toml version tag '$tag'"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Release tag: $tag"

      - name: Verify source
        shell: pwsh
        run: |
          # Without this only the last command's exit code fails the step.
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        shell: pwsh
        run: cargo build --locked --release

      - name: Package executable, complete Skill and guided link installer
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assetPath = Join-Path $PWD "dist\codex-hosts-windows-x86_64.zip"
          $checksumPath = "$assetPath.sha256"
          $assetName = Split-Path -Leaf $assetPath
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Verified distribution ZIP is missing: $assetPath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "ZIP checksum file is missing: $checksumPath"
          }
          $buildSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $buildSha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the built source revision"
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagLines = @(git ls-remote --tags origin $tagRef "$tagRef^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect remote release tag '$env:RELEASE_TAG'"
          }
          $peeledTag = $tagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          $directTag = $tagLines | Where-Object { $_ -match [regex]::Escape($tagRef) + '$' } | Select-Object -First 1
          $tagLine = if ($peeledTag) { $peeledTag } else { $directTag }
          if ($tagLine) {
            $tagCommit = ($tagLine -split '\s+')[0]
            if ($tagCommit -ne $buildSha) {
              throw "Tag '$env:RELEASE_TAG' points to $tagCommit, not built commit $buildSha. Bump the package version before publishing new source."
            }
          }

          $releaseJson = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json assets,isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $releaseJson | ConvertFrom-Json
            if ($existingRelease.isDraft) {
              throw "Release '$env:RELEASE_TAG' exists as a draft and is not downloadable. Resolve the draft before rerunning."
            }
            if (-not $tagLine) {
              throw "Release '$env:RELEASE_TAG' exists but its remote tag is missing. Resolve the release before rerunning."
            }
            if (-not @($existingRelease.assets | Where-Object { $_.name -eq $assetName }).Count) {
              throw "Release '$env:RELEASE_TAG' exists without $assetName. Resolve the incomplete release before rerunning."
            }
            Write-Output "Existing downloadable release: $($existingRelease.url)"
            exit 0
          }

          $releaseUrl = gh release create "$env:RELEASE_TAG" "$assetPath" "$checksumPath" --repo "$env:GITHUB_REPOSITORY" --target "$buildSha" --generate-notes --title "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish release '$env:RELEASE_TAG' with $assetName"
          }
          Write-Output "Downloadable release: $releaseUrl"

