name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: Build release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.92
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
          rustc --version
          cargo --version

      - name: Resolve release tag from Cargo.toml
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed"
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq "codex-hosts" })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one codex-hosts package in Cargo metadata"
          }
          $tag = "v$($packages[0].version)"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Cargo.toml version must use the MAJOR.MINOR.PATCH format"
          }
          if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME -ne $tag) {
            throw "Pushed tag '$env:REF_NAME' does not match Cargo.toml version tag '$tag'"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Release tag: $tag"

      - name: Verify source
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        shell: pwsh
        run: cargo build --locked --release

      - name: Create minimal distribution ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stagingRoot = Join-Path $PWD "dist\staging"
          $archivePath = Join-Path $PWD "dist\codex-hosts-windows-x86_64.zip"

          if (Test-Path -LiteralPath $stagingRoot) {
            Remove-Item -LiteralPath $stagingRoot -Recurse -Force
          }
          if (Test-Path -LiteralPath $archivePath) {
            Remove-Item -LiteralPath $archivePath -Force
          }

          $binDirectory = Join-Path $stagingRoot "bin"
          $skillDirectory = Join-Path $stagingRoot "skill\codex-hosts"
          $agentDirectory = Join-Path $skillDirectory "agents"
          $referenceDirectory = Join-Path $skillDirectory "references"
          New-Item -ItemType Directory -Path $binDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $agentDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $referenceDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path -Parent $archivePath) -Force | Out-Null

          Copy-Item -LiteralPath ".\target\release\codex-hosts.exe" -Destination $binDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\SKILL.md" -Destination $skillDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\agents\openai.yaml" -Destination $agentDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\references\hardware-keys.md" -Destination $referenceDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\references\host-editor.md" -Destination $referenceDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\references\long-running.md" -Destination $referenceDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\references\temporary-secrets.md" -Destination $referenceDirectory
          Copy-Item -LiteralPath ".\skill\codex-hosts\references\tool-protocol.md" -Destination $referenceDirectory
          Copy-Item -LiteralPath ".\scripts\install-local-skill.ps1" -Destination $stagingRoot

          $expectedFiles = @(
            "bin/codex-hosts.exe",
            "install-local-skill.ps1",
            "skill/codex-hosts/SKILL.md",
            "skill/codex-hosts/agents/openai.yaml",
            "skill/codex-hosts/references/hardware-keys.md",
            "skill/codex-hosts/references/host-editor.md",
            "skill/codex-hosts/references/long-running.md",
            "skill/codex-hosts/references/temporary-secrets.md",
            "skill/codex-hosts/references/tool-protocol.md"
          ) | Sort-Object
          $actualFiles = @(
            Get-ChildItem -LiteralPath $stagingRoot -Recurse -File | ForEach-Object {
              [System.IO.Path]::GetRelativePath($stagingRoot, $_.FullName).Replace("\", "/")
            }
          ) | Sort-Object
          if (@(Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles).Count -ne 0) {
            throw "Unexpected release staging layout"
          }

          Compress-Archive -Path (Join-Path $stagingRoot "*") -DestinationPath $archivePath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $archiveFiles = @(
              $archive.Entries | Where-Object { $_.Name } | ForEach-Object {
                $_.FullName.Replace("\", "/")
              }
            ) | Sort-Object
          } finally {
            $archive.Dispose()
          }
          if (@(Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $archiveFiles).Count -ne 0) {
            throw "Unexpected ZIP contents"
          }

          Write-Output "ZIP files: $($archiveFiles -join ', ')"
          Write-Output "Executable SHA-256: $((Get-FileHash -Algorithm SHA256 -LiteralPath '.\target\release\codex-hosts.exe').Hash)"
          Remove-Item -LiteralPath $stagingRoot -Recurse -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assetPath = Join-Path $PWD "dist\codex-hosts-windows-x86_64.zip"
          $assetName = Split-Path -Leaf $assetPath
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Verified distribution ZIP is missing: $assetPath"
          }
          $buildSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $buildSha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the built source revision"
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagLines = @(git ls-remote --tags origin $tagRef "$tagRef^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect remote release tag '$env:RELEASE_TAG'"
          }
          $peeledTag = $tagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          $directTag = $tagLines | Where-Object { $_ -match [regex]::Escape($tagRef) + '$' } | Select-Object -First 1
          $tagLine = if ($peeledTag) { $peeledTag } else { $directTag }
          if ($tagLine) {
            $tagCommit = ($tagLine -split '\s+')[0]
            if ($tagCommit -ne $buildSha) {
              throw "Tag '$env:RELEASE_TAG' points to $tagCommit, not built commit $buildSha. Bump the package version before publishing new source."
            }
          }

          $releaseJson = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json assets,isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $releaseJson | ConvertFrom-Json
            if ($existingRelease.isDraft) {
              throw "Release '$env:RELEASE_TAG' exists as a draft and is not downloadable. Resolve the draft before rerunning."
            }
            if (-not $tagLine) {
              throw "Release '$env:RELEASE_TAG' exists but its remote tag is missing. Resolve the release before rerunning."
            }
            if (-not @($existingRelease.assets | Where-Object { $_.name -eq $assetName }).Count) {
              throw "Release '$env:RELEASE_TAG' exists without $assetName. Resolve the incomplete release before rerunning."
            }
            Write-Output "Existing downloadable release: $($existingRelease.url)"
            exit 0
          }

          $releaseUrl = gh release create "$env:RELEASE_TAG" "$assetPath" --repo "$env:GITHUB_REPOSITORY" --target "$buildSha" --generate-notes --title "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish release '$env:RELEASE_TAG' with $assetName"
          }
          Write-Output "Downloadable release: $releaseUrl"

