name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, test, and lint
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.92
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      # Each step runs the same command as scripts/check.ps1 locally, cheapest
      # first, so a failure names its own step.
      - name: Format
        shell: pwsh
        run: .\scripts\check.ps1 -Step format

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Lint
        shell: pwsh
        run: .\scripts\check.ps1 -Step lint

      - name: Test
        shell: pwsh
        run: .\scripts\check.ps1 -Step test

      - name: Dependency guard
        shell: pwsh
        run: .\scripts\check.ps1 -Step guard
