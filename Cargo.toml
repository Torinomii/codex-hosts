[package]
name = "codex-hosts"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "A small, auditable GUI for stable Codex-managed SSH and Telnet hosts on Windows."
readme = "README.md"
build = "build.rs"

[dependencies]
csv = "1"
eframe = { version = "0.35.0", default-features = false, features = ["wgpu"] }
keyring = "4.1.6"
rfd = "0.17.2"
russh = "0.62.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
ciborium = "0.2"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
